<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title> | ProDig Blog</title>
    
    <!-- SEO & Canonical -->
    <link rel="canonical" href="https://aiprodig.com/blog/">
    <link rel="alternate" hreflang="en" href="https://aiprodig.com/en/blog/">
    
    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #2563eb;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --bg-body: #ffffff;
            --bg-card: #f9fafb;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background: var(--bg-body);
        }
        
        .article-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .category-tag {
            background: var(--accent);
            color: white;
            padding: 0.25rem 1rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .date {
            color: var(--text-secondary);
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        
        .main-title {
            font-size: 2.5rem;
            line-height: 1.2;
            margin: 1.5rem 0;
            font-weight: 600;
        }
        
        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 3rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        
        .article-body {
            font-size: 1.15rem;
            color: var(--text-main);
            margin-bottom: 4rem;
        }
        
        .article-subtitle {
            font-size: 1.8rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        .article-paragraph {
            margin-bottom: 1.5rem;
        }
        
        b, strong {
            font-weight: 600;
        }
        
        .sources {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 4rem;
            border-left: 4px solid var(--accent);
        }
        
        .interaction-footer {
            border-top: 1px solid #eee;
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .btn-share {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid #eee;
            background: white;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        
        .btn-share:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }
        
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 3px #999;
            z-index: 100;
            text-decoration: none;
        }
    </style>
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G5Z4R6W8NX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-G5Z4R6W8NX');
    </script>
</head>
<body>
    <main class="article-container">
        <header>
            <span class="category-tag"></span>
            <p class="date"></p>
            <h1 class="main-title"></h1>
        </header>
        
        <img src="/blog/images/" alt="" class="hero-image">
        
        <article class="article-body">
            
        </article>
        
        <section class="sources">
            <h4>Fuentes y Referencias:</h4>
            <div class="sources-list"></div>
        </section>
        
        <footer class="interaction-footer">
            <div class="interaction-buttons">
                <button class="btn-share" onclick="alert('¡Gracias por tu apoyo!')">❤️ Me gusta</button>
            </div>
            <div class="share-buttons" style="display:flex; gap: 0.5rem;">
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://aiprodig.com/blog/" class="btn-share" target="_blank">LinkedIn</a>
                <a href="https://twitter.com/intent/tweet?url=https://aiprodig.com/blog/&text=" class="btn-share" target="_blank">X</a>
                <a href="https://wa.me/?text=%20https://aiprodig.com/blog/" class="btn-share" target="_blank">WhatsApp</a>
            </div>
        </footer>
    </main>

    <a href="https://wa.me/573144897092" class="whatsapp-float" target="_blank">
        <span style="font-size: 24px">WP</span>
    </a>
</body>
</html>
